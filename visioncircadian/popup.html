<!-- popup.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 12px;
      
    }

    .score {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #reloadBtn {
      background: #2e86de;
      color: white;
    }

    #infoBtn {
      background: #ecf0f1;
    }

    #infoPanel {
      margin-top: 10px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .spinner {
  width: 26px;
  height: 26px;
  border: 4px solid #eee;
  border-top: 4px solid #2e86de;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 8px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.low { color: #2ecc71; }     /* green */
.medium { color: #f1c40f; }  /* yellow */
.high { color: #e74c3c; }    /* red */



  </style>
</head>

<body>
  <div id="spinner" class="spinner" style="display:none;"></div>

  
  <div class="score" id="cs">--</div>
  <div id="label">Circadian Stimulus</div>
  

  <!-- <button id="reloadBtn">Recalculate</button> -->
  <button id="infoBtn">What does this mean?</button>

  <div id="infoPanel">
    <b>Circadian Stimulus (CS)</b><br><br>

    0.00 - 0.10 → minimal biological effect<br>
    0.10 - 0.30 → low circadian activation<br>
    0.30 - 0.50 → moderate stimulation<br>
    0.50 - 0.75 → strong melatonin suppression<br><br>
    

    Higher values mean stronger alerting
    effect from screen light.
  </div>

  <script src="popup.js"></script>
</body>
</html>
