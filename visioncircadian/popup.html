<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 280px;
      background: #0f1117;
      color: #e8eaf0;
      padding: 16px;
      padding-bottom: 18px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
    }
    .header-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ecc71;
      flex-shrink: 0;
      transition: background 0.4s;
    }
    .header-dot.loading {
      background: #3a4052;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    .header-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #4b5368;
      text-transform: uppercase;
    }

    /* ── Main score ── */
    .score-section { text-align: center; padding: 4px 0 2px; }
    .score-value {
      font-size: 60px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #e8eaf0;
      transition: color 0.4s;
    }
    .score-subtitle {
      font-size: 11px;
      color: #4b5368;
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .impact-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.02em;
      background: #1a1d2a;
      color: #4b5368;
      transition: background 0.4s, color 0.4s;
    }

    /* ── Gauge ── */
    .gauge-track {
      background: #1a1d2a;
      border-radius: 4px;
      height: 5px;
      margin: 14px 0 12px;
      overflow: hidden;
    }
    .gauge-fill {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.5s ease, background 0.4s;
      background: #3a4052;
    }

    /* ── 2×2 metric grid ── */
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-card {
      background: #1a1d2a;
      border-radius: 10px;
      padding: 10px 12px;
      position: relative;
      overflow: visible;
    }
    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4b5368;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .metric-value {
      font-size: 20px;
      font-weight: 700;
      color: #c8ccd8;
      line-height: 1;
    }
    .metric-unit {
      font-size: 11px;
      font-weight: 400;
      color: #4b5368;
    }

    /* ── Time weight strip (full-width, compact) ── */
    .time-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1d2a;
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 8px;
    }
    .time-strip-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4b5368;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .time-strip-value {
      font-size: 14px;
      font-weight: 700;
      color: #c8ccd8;
    }

    /* ── Tooltip ── */
    .tip {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #252836;
      color: #4b5368;
      font-size: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: help;
      position: relative;
      flex-shrink: 0;
      border: 1px solid #2e3347;
    }
    .tip::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 7px);
      left: -8px;
      width: 190px;
      background: #1e2130;
      color: #a0a8b8;
      font-size: 11px;
      line-height: 1.55;
      padding: 9px 11px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      border: 1px solid #2e3347;
      white-space: normal;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }
    /* Right-column tooltips open leftward to avoid clipping */
    .tip.tip-r::after { left: auto; right: -8px; }
    /* Bottom-of-popup tooltips open upward to avoid clipping */
    .tip.tip-up::after { top: auto; bottom: calc(100% + 7px); }
    .tip:hover::after { opacity: 1; }

    /* ── Color classes ── */
    .low    { color: #2ecc71; }
    .medium { color: #f1c40f; }
    .high   { color: #e74c3c; }

    .low-badge    { background: rgba(46,204,113,0.12); color: #2ecc71; }
    .medium-badge { background: rgba(241,196,15,0.12);  color: #f1c40f; }
    .high-badge   { background: rgba(231,76,60,0.12);   color: #e74c3c; }

    .low-gauge    { background: #2ecc71; }
    .medium-gauge { background: #f1c40f; }
    .high-gauge   { background: #e74c3c; }

    .cct-warm    { color: #ff9f43; }
    .cct-neutral { color: #c8ccd8; }
    .cct-cool    { color: #74b9ff; }

    /* ── Footer ── */
    .footer {
      font-size: 10px;
      color: #2a2d3e;
      text-align: center;
      margin-top: 12px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-dot loading" id="headerDot"></div>
    <span class="header-title">VisionCircadian</span>
  </div>

  <div class="score-section">
    <div class="score-value" id="csValue">--</div>
    <div class="score-subtitle">Circadian Stimulus</div>
    <div class="impact-badge" id="impactBadge">Calculating…</div>
  </div>

  <div class="gauge-track">
    <div class="gauge-fill" id="gaugeFill"></div>
  </div>

  <div class="metrics">

    <div class="metric-card">
      <div class="metric-label">
        CS Score
        <span class="tip"
          data-tip="Circadian Stimulus (0–0.75). Combines screen melanopic light, how long you've been on this tab, and time-of-day sensitivity. Higher = more melatonin suppression.">?</span>
      </div>
      <div class="metric-value" id="csSmall">--</div>
    </div>

    <div class="metric-card">
      <div class="metric-label">
        Tab Exposure
        <span class="tip tip-r"
          data-tip="Minutes on this tab. The CS formula integrates light dose over time — short visits at high CLA matter less than sustained ones.">?</span>
      </div>
      <div class="metric-value" id="exposureValue">-- <span class="metric-unit">min</span></div>
    </div>

    <div class="metric-card">
      <div class="metric-label">
        CLA
        <span class="tip"
          data-tip="Circadian Light (melanopic lux). Raw screen energy weighted by ipRGC sensitivity (CIE S 026:2018). Peak sensitivity is near 490 nm — blue-cyan light scores highest.">?</span>
      </div>
      <div class="metric-value" id="claValue">--</div>
    </div>

    <div class="metric-card">
      <div class="metric-label">
        Color Temp
        <span class="tip tip-r"
          data-tip="Correlated Color Temperature (CCT) of visible screen content. Warmer (2700 K) = amber/orange tones, less blue. Cooler (6500 K) = daylight-like, more blue, higher circadian impact.">?</span>
      </div>
      <div class="metric-value" id="cctValue">-- <span class="metric-unit">K</span></div>
    </div>

  </div>

  <!-- Time-of-day weight: full-width compact strip -->
  <div class="time-strip">
    <span class="time-strip-label">
      Time Weight
      <span class="tip tip-up tip-r"
        data-tip="Biological sensitivity multiplier for the current hour. Morning ×1.0 · Afternoon ×0.6 · Evening ×1.3 · Night ×1.6. Screen light is most disruptive after sunset.">?</span>
    </span>
    <span class="time-strip-value" id="timeWeightValue">--</span>
  </div>

  <div class="footer">live · per-tab · updates every second</div>

  <script src="popup.js"></script>
</body>
</html>
